  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 24px 0;
}

.data-stat {
  background: linear-gradient(135deg, rgba(196,163,90,0.06), rgba(139,26,26,0.04));
  border: 1px solid var(--color-border-gold);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  text-align: center;
}

.data-stat__num {
  font-family: var(--font-en);
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #dcc07a 0%, #c4a35a 50%, #8b1a1a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.data-stat__label {
  font-size: 0.72rem;
  color: var(--color-text-secondary);
  font-weight: 600;
  margin-top: 4px;
  line-height: 1.4;
}

.reason-card__highlight {
  background: none;
  border-left: none;
  border-radius: 0;
  padding: 16px 0;
  margin: 20px 0;
  font-size: 1.2rem;
  line-height: 1.9;
  color: #8b1a1a;
  font-weight: 900;
  box-shadow: 0 2px 12px rgba(196,163,90,0.08);
}

/* Internal image placeholder */
.reason-card__inner-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  margin: 20px 0;
  background: var(--color-bg-alt);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  font-size: 0.82rem;
}

/* ========== Treatment Flow ========== */
.flow {
  background: var(--gradient-light);
}

.flow__steps {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 40px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}

.flow__step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 0;
  position: relative;
}

.flow__step::after {
  content: '';
  position: absolute;
  left: 18px;
  top: 56px;
  bottom: -4px;
  width: 2px;
  background: linear-gradient(180deg, var(--color-gold) 0%, rgba(196,163,90,0.2) 100%);
}

.flow__step:last-child::after {
  display: none;
}

.flow__step-num {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  background: var(--gradient-gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a0a0a;
  font-family: var(--font-en);
  font-size: 0.82rem;
  font-weight: 800;
  position: relative;
  z-index: 1;
  box-shadow: 0 2px 10px rgba(196,163,90,0.3);
}

.flow__step-content {
  flex: 1;
  padding-top: 6px;
}

.flow__step-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 4px;
}

.flow__step-desc {
  font-size: 0.82rem;
  color: var(--color-text-light);
  line-height: 1.6;
}

.flow__video-placeholder {
  width: 100%;
  aspect-ratio: 16/9;
  margin-top: 36px;
  background: var(--color-bg-alt);
  border: 1px dashed var(--color-border);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  font-size: 0.82rem;
}

/* ========== Before After ========== */
.result-ba {
  background: linear-gradient(180deg, var(--color-bg) 0%, #f5efe4 55%, #ede5d6 100%);
}

.result-ba .section-line {
  background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
  margin-top: 20px;
  box-shadow: 0 0 16px rgba(196,163,90,0.2);
}

.result-ba__cases {
  display: flex;
  flex-direction: column;
  gap: 24px;
  max-width: 720px;
  margin: 48px auto 0;
}

.result-ba__case {
  position: relative;
}

.result-ba__pair {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.result-ba__photo {
  position: relative;
  overflow: hidden;
  background: #e8ecf2;
  display: flex;
  align-items: center;
  justify-content: center;
}

.result-ba__photo img {
  width: 100%;
  height: auto;
  display: block;
}

.result-ba__labels {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.result-ba__label {
  padding: 8px 16px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.result-ba__label--before { background: linear-gradient(135deg, rgba(0,0,0,0.5), transparent); }
.result-ba__label--after { background: linear-gradient(225deg, rgba(196,163,90,0.7), transparent); }

/* ========== 5 Reasons ========== */
.five-reasons {
  background: #f7f5f2;
}

.five-reason {
  display: flex;
  flex-direction: column;
  margin-bottom: 0;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  margin-top: 18px;
  margin-left: auto;
  margin-right: auto;
}

.text-center + .five-reason {
  margin-top: 28px;
}

.five-reason__img {
  width: 100%;
  height: 220px;
  flex-shrink: 0;
  overflow: hidden;
}

.five-reason__img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.five-reason__body {
  flex: 1;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.five-reason__num {
  font-family: var(--font-en);
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--color-primary);
  opacity: 0.25;
  line-height: 1;
  margin-bottom: 8px;
}

.five-reason__title {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.5;
  margin-bottom: 14px;
  color: var(--color-primary);
}

.five-reason__text {
  font-size: 0.88rem;
  line-height: 1.85;
  color: var(--color-text-secondary);
}

.five-reason__text p {
  margin-bottom: 10px;
}

.five-reason__text p:last-child {
  margin-bottom: 0;
}

/* ========== Testimonials ========== */
.testimonials {
  background: var(--gradient-light);
}

.testimonial {
  background: linear-gradient(135deg, #fffdf8 0%, #f9f4eb 100%);
  border: 1px solid var(--color-border-gold);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  margin-bottom: 20px;
  transition: var(--transition);
}

.testimonial:last-child {
  margin-bottom: 0;
}

.testimonial:hover {
  box-shadow: var(--shadow-gold);
  border-color: var(--color-gold);
}

.testimonial__text {
  font-size: 0.88rem;
  line-height: 2;
  color: var(--color-text-secondary);
  position: relative;
  padding-left: 20px;
}

.testimonial__text::before {
  content: '\201C';
  position: absolute;
  left: 0;
  top: -4px;
  font-size: 1.8rem;
  color: var(--color-gold);
  font-weight: 700;
  line-height: 1;
}

/* ========== Pricing ========== */
.pricing {
  background: var(--color-bg);
  color: var(--color-text);
}

.pricing .section-num { color: var(--color-accent); opacity: 0.8; }
.pricing .section-num::before,
.pricing .section-num::after { background: var(--gradient-accent); opacity: 0.4; }
.pricing .section-title {
  background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-accent-dark) 60%, #3a0a0a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.pricing .section-line { background: var(--gradient-accent); box-shadow: none; }

.pricing__card {
  background: #ffffff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 36px 28px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 32px;
}

.pricing__label {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--color-accent);
  margin-bottom: 8px;
  text-align: center;
}

.pricing__title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: 16px;
  line-height: 1.6;
}

.pricing__row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 14px 0;
  border-bottom: 1px solid var(--color-border-light);
}

.pricing__row:last-child {
  border-bottom: none;
}

.pricing__row-label {
  font-size: 0.88rem;
  color: var(--color-text-secondary);
  font-weight: 600;
}

.pricing__row-value {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--color-gold-dark);
}

.pricing__row-value small {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--color-text-light);
}

.pricing__note {
  font-size: 0.78rem;
  color: var(--color-text-light);
  margin-top: 12px;
  line-height: 1.7;
}

/* Benefits list */
.pricing__benefits {
  margin-top: 32px;
}

.pricing__benefits-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pricing__benefits-title::before {
  content: '';
  width: 4px;
  height: 18px;
  background: var(--color-accent);
  border-radius: 2px;
}

.pricing__benefit-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--color-text-secondary);
  border-bottom: 1px solid var(--color-border-light);
}

.pricing__benefit-item:last-child {
  border-bottom: none;
}

.pricing__benefit-check {
  flex-shrink: 0;
  color: var(--color-accent);
  font-weight: 700;
  font-size: 1rem;
  margin-top: 2px;
}

/* Price Example */
.pricing__example {
  background: linear-gradient(135deg, #f9f4eb 0%, #f5eed4 100%);
  border: 1px solid var(--color-border-gold);
  border-radius: var(--radius-md);
  padding: 24px 20px;
  margin-top: 32px;
}

.pricing__example-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--color-gold-dark);
  margin-bottom: 12px;
}

.pricing__example-text {
  font-size: 0.85rem;
  line-height: 1.8;
  color: var(--color-text-secondary);
}

.pricing__example-highlight {
  font-weight: 700;
  color: var(--color-accent);
}

.pricing .pricing__example {
  background: linear-gradient(135deg, #f9f4eb 0%, #f5eed4 100%);
  border-color: var(--color-border-gold);
}
.pricing .pricing__example-title { color: var(--color-gold-dark); }
.pricing .pricing__example-text { color: var(--color-text-secondary); }
.pricing . pricing__example-highlight { color: var(--color-accent); }

/* ========== Flow to Start ========== */
.start-flow {
  background: var(--gradient-light);
}

.start-flow__steps {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  margin-top: 40px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
}

.start-flow__step {
  text-align: center;
  padding: 24px 20px;
  position: relative;
}

.start-flow__step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  background: var(--gradient-gold);
  border-radius: 50%;
  color: #0f0505;
  font-family: var(--font-en);
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(196,163,90,0.3);
}

.start-flow__step-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 4px;
}

.start-flow__step-desc {
  font-size: 0.78rem;
  color: var(--color-text-light);
}

.start-flow__arrow {
  text-align: center;
  font-size: 1.4rem;
  color: var(--color-gold);
  line-height: 1;
  padding: 4px 0;
}

/* ========== CTA Banner ========== */
.cta-banner {
  background: var(--gradient-cta);
  color: var(--color-white);
  padding: 72px 0;
  position: relative;
  overflow: hidden;
}

.cta-banner::before {
  content: '';
  position: absolute;
  top: -60%; left: 50%;
  transform: translateX(-50%);
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(196,163,90,0.06) 0%, transparent 60%);
  border-radius: 50%;
  pointer-events: none;
}

.cta-banner__title {
  font-size: 1.35rem;
  font-weight: 700;
  line-height: 1.7;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #dcc07a 0%, #c4a35a 50%, #ffffff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.cta-banner__desc {
  font-size: 1rem;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  line-height: 1.7;
  margin-bottom: 20px;
}

.cta-banner__sub {
  font-size: 0.88rem;
  color: rgba(255,255,255,0.6);
  margin-bottom: 32px;
}

.cta-banner__image-placeholder {
  width: 80%;
  max-width: 400px;
  aspect-ratio: 4/3;
  margin: 0 auto 32px;
  background: rgba(255,255,255,0.06);
  border: 1px dashed rgba(255,255,255,0.2);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.35);
  font-size: 0.82rem;
}

/* Mid CTA (reused) */
.mid-cta {
  background: linear-gradient(135deg, #8a0e2e 0%, #b6123a 50%, #d4164a 100%);
  padding: 48px 0;
  position: relative;
  overflow: hidden;
}

.mid-cta__inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  position: relative;
  z-index: 1;
}

.mid-cta__content {
  width: 100%;
  text-align: center;
}

.mid-cta__lead {
  font-size: 1.25rem;
  font-weight: 900;
  margin-bottom: 12px;
  letter-spacing: 0.04em;
  color: #fff;
  -webkit-text-fill-color: #fff;
  line-height: 1.6;
}

.mid-cta__text {
  font-size: 0.92rem;
  color: rgba(255,255,255,0.85);
  line-height: 1.8;
  margin-bottom: 20px;
}

.mid-cta .btn--primary {
  display: inline-flex;
  background: linear-gradient(135deg, #a08030 0%, #c4a35a 30%, #dcc07a 50%, #c4a35a 70%, #a08030 100%);
  color: #0f0505;
  font-weight: 900;
  font-size: 1.1rem;
  padding: 18px 28px;
  letter-spacing: 0.03em;
  border: none;
  box-shadow: 0 6px 24px rgba(0,0,0,0.3), 0 4px 16px rgba(196,163,90,0.35);
  animation: cta-pulse 2.4s ease-in-out infinite;
  position: relative;
  overflow: hidden;
  white-space: normal;
  text-align: center;
  line-height: 1.35;
  justify-content: center;
  border-radius: var(--radius-md);
}

.mid-cta .btn--primary::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
  animation: cta-shimmer 3s ease-in-out infinite;
}

.mid-cta .btn--primary:hover {
  box-shadow: 0 6px 28px rgba(196,163,90,0.5);
  animation: none;
  transform: translateY(-2px);
}

.mid-cta__img {
  width: 140px;
  height: auto;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
}

@keyframes cta-pulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(196,163,90,0.3); transform: scale(1); }
  50% { box-shadow: 0 6px 32px rgba(196,163,90,0.5); transform: scale(1.03); }
}

@keyframes cta-shimmer {
  0% { left: -100%; }
  60% { left: 100%; }
  100% { left: 100%; }
}

/* ========== Final CTA ========== */
.final-cta {
  background: linear-gradient(135deg, #8a0e2e 0%, #b6123a 50%, #d4164a 100%);
  color: var(--color-white);
  padding: 60px 0;
  position: relative;
  overflow: hidden;
}

.final-cta__wrapper {
  display: flex;
  align-items: center;
  gap: 24px;
}

.final-cta__content {
  flex: 1;
  text-align: left;
}

.final-cta__lead {
  font-size: 0.88rem;
  color: rgba(255,255,255,0.85);
  margin-bottom: 10px;
  line-height: 1.8;
}

.final-cta__title {
  font-size: 1.3rem;
  font-weight: 900;
  line-height: 1.7;
  margin-bottom: 20px;
  color: #ffffff;
}

.final-cta__title .hl {
  color: #fff;
  -webkit-text-fill-color: #fff;
}

.final-cta__buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 100%;
}

.final-cta__buttons .btn {
  width: 100%;
  padding: 18px 24px;
  font-size: 1rem;
  font-weight: 900;
  border-radius: var(--radius-md);
  text-align: center;
}

.final-cta__img {
  width: 160px;
  height: auto;
  flex-shrink: 0;
  filter: drop-shadow(0 6px 20px rgba(0,0,0,0.4));
}

/* Form Section */
.form-section {
  background: linear-gradient(180deg, #faf8f4 0%, #f5f0e8 100%);
  padding: 48px 0 60px;
}

.form-section__title {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--color-text);
  margin-bottom: 6px;
  line-height: 1.6;
}

.form-section__sub {
  text-align: center;
  font-size: 0.78rem;
  color: #666;
  margin-bottom: 24px;
}

.form-section__iframe-wrap {
  max-width: 600px;
  margin: 0 auto;
  overflow: hidden;
}

.form-section__iframe-wrap iframe {
  display: block;
  width: 100%;
  border: none;
  overflow: hidden;
}

.form-section,
.form-section__iframe-wrap,
#rizbell-form {
  overflow-anchor: none;
}

.btn--cta-primary {
  background: linear-gradient(135deg, #a08030 0%, #c4a35a 30%, #dcc07a 50%, #c4a35a 70%, #a08030 100%);
  color: #0f0505;
  box-shadow: 0 10px 34px rgba(0,0,0,0.3), 0 10px 28px rgba(196,163,90,0.4);
  animation: cta-pulse 2.4s ease-in-out infinite;
  position: relative;
  overflow: hidden;
}

.btn--cta-primary::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
  animation: cta-shimmer 3s ease-in-out infinite;
}

.btn--cta-secondary {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  backdrop-filter: blur(4px);
}

.btn--cta-secondary:hover {
  background: rgba(255,255,255,0.2);
}

.btn--cta-outline {
  background: transparent;
  color: var(--color-gold-light);
  border: 1px solid var(--color-gold);
}

.btn--cta-outline:hover {
  background: rgba(196,163,90,0.15);
}

/* ========== Offer Section ========== */
.offer {
  background: linear-gradient(180deg, #0a1520 0%, #0f1e2e 40%, #0a1520 100%);
  padding: 56px 0;
  position: relative;
  overflow: hidden;
}

.offer__card {
  background: linear-gradient(145deg, #c9a84c 0%, #e8d48a 15%, #c4a35a 35%, #a88a30 60%, #c4a35a 80%, #e8d48a 100%);
  border-radius: 12px;
  padding: 28px 20px;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
}

.offer__badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.offer__badge-label {
  background: #1a1a1a;
  color: #e8d48a;
  font-size: 0.65rem;
  font-weight: 900;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.08em;
}

.offer__badge-text {
  font-size: 0.9rem;
  font-weight: 900;
  color: #1a1a1a;
}

.offer__card-title {
  font-size: 1.05rem;
  font-weight: 900;
  color: #1a1a1a;
  line-height: 1.6;
  margin-bottom: 18px;
}

.offer__benefit {
  background: rgba(30,30,30,0.85);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.offer__benefit-main {
  flex: 1;
}

.offer__benefit-img {
  width: 100px;
  height: auto;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

.offer__benefit-num {
  font-family: var(--font-en);

<!-- JavaScript（Rizbell は defer でメインスレッド競合を軽減） -->
<script defer src="https://lfo.rizbell.com/embed-form.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var els = document.querySelectorAll('.fade-up');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(function(el) { el.classList.add('visible'); });
  }
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.01, rootMargin: '0px 0px 25% 0px' });
  if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    els.forEach(function(el) { observer.observe(el); });
  }

  var floatingCta = document.querySelector('.floating-cta');
  var formSection = document.querySelector('.form-section') || document.querySelector('.final-cta');
  if (floatingCta && formSection) {
    var ctaObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          floatingCta.classList.add('is-hidden');
        } else {
          floatingCta.classList.remove('is-hidden');
        }
      });
    }, { threshold: 0.15 });
    ctaObserver.observe(formSection);
  }

  function scrollFormIntoView() {
    var el = document.getElementById('form');
    if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  if (window.location.hash === '#form') {
    requestAnimationFrame(scrollFormIntoView);
  } else {
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function(ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var a = t.closest('a[href="#form"], a[href$="#form"]');
    if (a) {
      ev.preventDefault();
      history.pushState(null, '', '#form');
      scrollFormIntoView();
    }
  }, true);
});
</script>
